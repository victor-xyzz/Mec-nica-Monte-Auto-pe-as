<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="img/logomonte.jpg" alt="Logo da Mecânica Monte Auto-peças" width="80" height="80">
        <nav>
        <a href="index.html">Home </a>
        <a href="sobre.html">Sobre Nós </a>

        <a href="simulador.html">Simulador de Preços </a>

        </nav>
    </header>

    <main>
        <h1>Cadastro do cliente e veículo</h1>
        <p>Preencha o formulário abaixo para se cadastrar e aproveitar nossos serviços e promoções.</p>
        <form id="form-cadastro">
            <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            </div>

            <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">
            </div>

            <div>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required placeholder="(99) 99999-9999">
            </div>

            <div>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            </div>
            <div>
            <label for="veiculo">Veículo:</label>
            <input type="text" id="veiculo" name="veiculo" required>
            </div>

            <input type="submit" value="Cadastrar">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Mecânica Monte Auto-peças. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
